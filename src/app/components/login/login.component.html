<form class="login-card" (ngSubmit)="onLogin()" #loginForm="ngForm" dir="rtl">
  <h2>כניסה לחשבון</h2>

  <label for="email">דוא"ל:</label>
  <input id="email" type="email" name="email" [(ngModel)]="email" required />

  <label for="password">סיסמה:</label>
  <div class="password-wrapper">
  <input
    id="password"
    [type]="showPassword ? 'text' : 'password'"
    name="password"
    [(ngModel)]="password"
    required
  />

  <span
    class="material-icons eye"
    (click)="showPassword = !showPassword"
  >
    {{ showPassword ? 'visibility_off' : 'visibility' }}
  </span>
</div>


  <div class="buttons">
    <button type="submit" [disabled]="!loginForm.valid">כניסה עם דוא"ל וסיסמא</button>
    <button type="button" class="secondary" (click)="goToRegister()">הרשמה לאתר</button>
  </div>
  <div>
    <a [routerLink]="['/forgot-password']">שכחתי סיסמא</a>
  </div>

  <!-- Hidden entirely when the server has no provider configured, so the
       divider never floats above an empty space.
       Facebook is out of the condition while its button is commented out
       below: logging in through it needs a Meta business verification we have
       not done yet, so only Google can bring the divider onto the page. -->
  <ng-container *ngIf="showGoogle">
    <div class="divider"><span>או</span></div>

    <div class="social">
      <!-- Google draws its own button inside this host. -->
      <div class="google-host" *ngIf="showGoogle" #googleBtn></div>

      <!-- Facebook login, parked until Meta approves the app as a business.
           Everything behind it still exists (the button handler, the service
           and the server route) - only this markup is out.
      <button
        *ngIf="showFacebook"
        type="button"
        class="facebook"
        [disabled]="facebookBusy"
        (click)="onFacebookLogin()"
      >
        <svg class="fb-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.96h-1.51c-1.49 0-1.96.93-1.96 1.89v2.26h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"
          />
        </svg>
        {{ facebookBusy ? 'מתחבר...' : 'כניסה עם פייסבוק' }}
      </button>
      -->
    </div>
  </ng-container>

  <div class="error" *ngIf="error">{{ error }}</div>
  <div class="success" *ngIf="success">{{ success }}</div>
</form>
